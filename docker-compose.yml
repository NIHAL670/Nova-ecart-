# ============================================================================
# Development / demo orchestration.
#
#   docker compose up --build
#
# Brings up MongoDB + Redis + Backend (Express) + Frontend (Next.js).
# Env overrides go in backend/.env and frontend/.env.local (git-ignored).
# ============================================================================

services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build: ./backend
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/ecommerce
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm run migrate && npm run start"

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
